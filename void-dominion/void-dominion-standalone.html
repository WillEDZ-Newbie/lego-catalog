<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Void Dominion — local-first operating environment (standalone build).">
  <meta name="color-scheme" content="dark">
  <title>Void Dominion</title>
  <style>/* tokens.css — design tokens for colour, type, spacing, depth, glow, motion.
   Every visual surface reads from these so imagery/theme can be replaced
   without rewriting components (§16, §41). Base palette: dark void/obsidian,
   metallic silver, controlled green illumination. */

:root {
  /* Void / obsidian surfaces */
  --void-900: #05070b;
  --void-800: #0a0e16;
  --void-700: #10141f;
  --void-600: #171c2a;
  --void-500: #1f2637;
  --void-400: #2a3247;

  /* Metallic silver */
  --silver-100: #f2f4f8;
  --silver-200: #d7dce6;
  --silver-300: #b6becd;
  --silver-400: #8b93a5;
  --silver-500: #626a7d;

  /* Controlled green illumination */
  --green-300: #8fe6bd;
  --green-400: #4fd6a3;
  --green-500: #2fb488;
  --glow-green: 0 0 0.75rem rgba(79, 214, 163, 0.35);

  /* Status accents (non-colour indicators paired in components) */
  --accent-warn: #d6a24f;
  --accent-high: #d6785f;
  --accent-critical: #d65f7a;
  --accent-info: #4fb8d6;

  /* Semantic surface roles */
  --bg: var(--void-900);
  --bg-elev: var(--void-700);
  --bg-panel: var(--void-600);
  --bg-input: var(--void-800);
  --border: #232a3b;
  --border-strong: #313a52;
  --text: var(--silver-100);
  --text-muted: var(--silver-400);
  --link: var(--green-300);
  --accent: var(--green-400);

  /* Typography */
  --font-sans: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.85rem;
  --fs-md: 0.95rem;
  --fs-lg: 1.15rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2rem;
  --fs-3xl: 2.75rem;

  /* Spacing */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-8: 3rem;

  /* Radius & depth */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.45);

  /* Motion */
  --dur-fast: 120ms;
  --dur: 240ms;
  --dur-slow: 480ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* Z-index scale */
  --z-nav: 10;
  --z-status: 20;
  --z-toast: 80;
  --z-modal: 100;

  --nav-w: 264px;
}

:root.reduced-motion,
:root.reduced-motion * {
  --dur-fast: 0ms;
  --dur: 0ms;
  --dur-slow: 0ms;
}

/* reset.css — minimal modern reset. */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html, body { height: 100%; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, picture, svg, video, canvas { display: block; max-width: 100%; }
input, button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; padding: 0; }
:focus-visible { outline: 2px solid var(--green-400); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* base.css — element-level typography and primitives. */

body {
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(79, 214, 163, 0.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(79, 184, 214, 0.05), transparent 60%),
    var(--bg);
}

h1 { font-size: var(--fs-2xl); line-height: 1.15; letter-spacing: -0.01em; }
h2 { font-size: var(--fs-xl); line-height: 1.2; }
h3 { font-size: var(--fs-lg); }
p { color: var(--text); }
a { color: var(--link); }
a:hover { text-decoration: underline; }

.muted { color: var(--text-muted); }
.mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
.lead { font-size: var(--fs-lg); }
.link { color: var(--link); font-weight: 500; }
.sub { font-size: var(--fs-sm); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: var(--sp-4); }

code { font-family: var(--font-mono); font-size: 0.85em; background: var(--void-800); padding: 0.1em 0.35em; border-radius: 4px; }

.callout {
  border-left: 3px solid var(--border-strong);
  background: var(--void-800);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: var(--fs-sm);
}
.callout--warn { border-left-color: var(--accent-warn); color: var(--silver-200); }
.callout--boundary { border-left-color: var(--silver-500); }

.badge { display: inline-block; font-size: var(--fs-xs); padding: 0.15em 0.5em; border-radius: 999px; border: 1px dashed var(--border-strong); color: var(--text-muted); }
.badge--placeholder { border-style: dashed; }

.tag {
  display: inline-block; font-size: var(--fs-xs); padding: 0.1em 0.55em; border-radius: 999px;
  background: var(--void-500); color: var(--silver-200); border: 1px solid var(--border);
}
.tag--low, .tag--final { background: rgba(79, 214, 163, 0.15); color: var(--green-300); border-color: rgba(79, 214, 163, 0.3); }
.tag--medium, .tag--moderate { background: rgba(79, 184, 214, 0.15); color: #9fd8e6; }
.tag--high { background: rgba(214, 120, 95, 0.18); color: #e6a892; }
.tag--critical { background: rgba(214, 95, 122, 0.2); color: #e692a8; }
.tag--mock { background: rgba(214, 162, 79, 0.16); color: #e6c892; border-color: rgba(214,162,79,0.3); }

.chip { display: inline-block; font-size: var(--fs-xs); padding: 0.15em 0.6em; margin: 0.1em; border-radius: 999px; background: var(--void-500); color: var(--silver-300); }

/* layout.css — app shell grid, navigation, status strip. */

.app {
  display: grid;
  grid-template-columns: var(--nav-w) 1fr;
  grid-template-rows: 1fr auto;
  min-height: 100vh;
}

/* Sidebar navigation */
.nav {
  grid-row: 1 / span 2;
  background: linear-gradient(180deg, var(--void-800), var(--void-900));
  border-right: 1px solid var(--border);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: var(--z-nav);
}
.nav__brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) 0 var(--sp-3); }
.nav__glyph { color: var(--green-400); font-size: 1.3rem; filter: drop-shadow(var(--glow-green)); }
.nav__title { font-weight: 600; letter-spacing: 0.02em; }
.nav__primary { display: flex; flex-direction: column; gap: 2px; }
.nav__link { padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); display: flex; flex-direction: column; }
.nav__link:hover { background: var(--void-600); text-decoration: none; }
.nav__link[aria-current="page"] { background: var(--void-500); box-shadow: inset 2px 0 0 var(--green-400); }
.nav__link-label { font-weight: 500; }
.nav__link-hint { font-size: var(--fs-xs); color: var(--text-muted); }
.nav__section-label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--silver-500); margin-top: var(--sp-3); }
.nav__locations { display: flex; flex-direction: column; gap: 1px; }
.nav__loc { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); font-size: var(--fs-sm); }
.nav__loc:hover { background: var(--void-600); text-decoration: none; }
.nav__loc[aria-current="page"] { background: var(--void-500); }
.nav__loc-index { width: 1.4em; height: 1.4em; display: grid; place-items: center; border-radius: 50%; background: var(--void-500); color: var(--silver-300); font-size: var(--fs-xs); }
.nav__command { margin-top: auto; }

/* Main content column */
.main { display: flex; flex-direction: column; min-width: 0; }
.status-strip {
  display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
  padding: var(--sp-2) var(--sp-5);
  background: var(--void-800);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: var(--z-status);
}
.status-pill { font-size: var(--fs-xs); color: var(--silver-300); background: var(--void-600); padding: 0.2em 0.6em; border-radius: 999px; }
.status-pill--ok { color: var(--green-300); }
.status-pill--warn { color: #e6c892; }
.status-pill--muted { color: var(--silver-500); margin-left: auto; }

.content { padding: var(--sp-6) var(--sp-6) var(--sp-8); flex: 1; min-width: 0; }
.content:focus { outline: none; }

.view { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-5); }
.view__header { display: flex; flex-direction: column; gap: var(--sp-1); }
.view__header--location { flex-direction: row; align-items: center; gap: var(--sp-4); }
.loc-index { width: 2.4rem; height: 2.4rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--accent, var(--green-400)); color: var(--void-900); font-weight: 700; }
.crumb { font-size: var(--fs-sm); color: var(--text-muted); }
.tier-label { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.08em; color: var(--silver-500); margin-top: var(--sp-3); }

.footer { grid-column: 2; padding: var(--sp-3) var(--sp-6); border-top: 1px solid var(--border); color: var(--silver-500); font-size: var(--fs-xs); }

/* components.css — panels, cards, buttons, forms, tables, gallery, modal, toast. */

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--sp-5);
  box-shadow: var(--shadow-1);
}
.panel--focus { border-color: var(--border-strong); box-shadow: var(--shadow-2); }
.panel__title { font-size: var(--fs-lg); margin-bottom: var(--sp-3); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); }
.card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-5); }
.card--link:hover { border-color: var(--green-500); text-decoration: none; transform: translateY(-2px); transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.card h3 { margin-bottom: var(--sp-2); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-radius: var(--radius-sm); background: var(--void-500); color: var(--silver-100); border: 1px solid var(--border-strong); font-size: var(--fs-sm); transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.btn:hover { background: var(--void-400); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn--primary { background: var(--green-500); border-color: var(--green-400); color: var(--void-900); font-weight: 600; }
.btn--primary:hover { background: var(--green-400); }
.btn--danger { background: rgba(214, 95, 122, 0.15); border-color: var(--accent-critical); color: #e692a8; }
.btn--danger:hover { background: rgba(214, 95, 122, 0.25); }
.btn--ghost { background: transparent; }
.btn--icon { padding: var(--sp-1) var(--sp-2); background: transparent; border: none; font-size: 1rem; }
.btn--sm { padding: 0.15em 0.6em; font-size: var(--fs-xs); }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-3); }

/* Key/value lists */
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3) var(--sp-5); }
.kv--tight { gap: var(--sp-2) var(--sp-4); grid-template-columns: 1fr; }
.kv > div { display: flex; flex-direction: column; }
.kv dt { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--silver-500); }
.kv dd { color: var(--text); }

/* Lists */
.list { display: flex; flex-direction: column; gap: var(--sp-2); }
.list li { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.list--dots li { gap: var(--sp-2); }
.dot { width: 0.6em; height: 0.6em; border-radius: 50%; display: inline-block; }
.dot--ok { background: var(--green-400); }
.dot--warn { background: var(--accent-warn); }
.dot--bad { background: var(--accent-critical); }
.dot-row { display: flex; align-items: center; gap: var(--sp-2); }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

/* Forms */
.field { display: flex; flex-direction: column; gap: var(--sp-1); margin-bottom: var(--sp-3); }
.field > span { font-size: var(--fs-sm); color: var(--silver-300); }
.input, .field input, .field textarea, .field select {
  background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3); color: var(--text); width: 100%;
}
.input--lg { font-size: var(--fs-lg); padding: var(--sp-3); }
.field textarea { min-height: 5rem; resize: vertical; }
.toggle { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; }
.toggle input { width: auto; }

/* Tables */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table th, .table td { text-align: left; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); }
.table th { color: var(--silver-400); font-weight: 600; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; }

/* Map (Atlas) */
.map-tier { display: flex; justify-content: center; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--sp-3); }
.map-node { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-4); display: flex; flex-direction: column; gap: 2px; border-top: 2px solid var(--accent, var(--green-400)); text-align: left; }
.map-node:hover { border-color: var(--accent, var(--green-400)); text-decoration: none; transform: translateY(-2px); transition: transform var(--dur) var(--ease); }
.map-node--nexus { max-width: 360px; align-items: center; text-align: center; border-top-color: var(--green-400); box-shadow: var(--glow-green); }
.map-node--add { border-style: dashed; align-items: center; text-align: center; color: var(--text-muted); }
.map-node__index { font-size: var(--fs-xs); color: var(--silver-500); }
.map-node__symbol { font-size: 1.4rem; color: var(--accent, var(--green-400)); }
.map-node__name { font-weight: 600; }
.map-node__fn { font-size: var(--fs-xs); color: var(--text-muted); }

/* Worlds */
.world-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--sp-4); }
.world-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.world-card__cover { aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--void-500), var(--void-700)); display: grid; place-items: center; gap: var(--sp-2); position: relative; border-bottom: 2px solid var(--accent, var(--green-400)); }
.world-card__symbol { font-size: 2rem; color: var(--accent, var(--green-400)); }
.world-card__body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
.world-card__meta { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }

.world-hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--void-700)), var(--void-800)); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-6); display: flex; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
.world-hero__id { display: flex; gap: var(--sp-4); align-items: center; }
.world-hero__symbol { font-size: 2.6rem; color: var(--accent, var(--green-400)); }
.world-hero__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.world-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); }

/* Nexus grid */
.nexus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); }

/* Gallery */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--sp-3); }
.gallery-grid--masonry { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.tile { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.tile:hover { border-color: var(--green-500); text-decoration: none; }
.tile--slot { border-style: dashed; }
.tile__thumb { aspect-ratio: 1; background: linear-gradient(135deg, var(--void-500), var(--void-700)); display: grid; place-items: center; }
.tile__title { padding: var(--sp-2) var(--sp-3) 0; font-weight: 500; font-size: var(--fs-sm); }
.tile__meta { padding: 0 var(--sp-3) var(--sp-3); font-size: var(--fs-xs); }

/* Focal (home) */
.focal { position: relative; border-radius: var(--radius-lg); min-height: 280px; background: radial-gradient(600px 300px at 50% 30%, rgba(79,214,163,0.12), transparent 70%), linear-gradient(180deg, var(--void-700), var(--void-900)); border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; }
.focal--sm { min-height: 140px; }
.focal__halo { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px solid rgba(79,214,163,0.4); box-shadow: var(--glow-green); animation: haloPulse 6s var(--ease) infinite; }
.focal__caption { position: relative; text-align: center; display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; }
.focal__title { font-size: var(--fs-3xl); }

/* Object viewer */
.object-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
.object-preview { aspect-ratio: 4 / 3; display: grid; place-items: center; background: linear-gradient(135deg, var(--void-500), var(--void-700)); border-radius: var(--radius); }

/* Approvals */
.approval { border: 1px solid var(--border-strong); border-radius: var(--radius); padding: var(--sp-4); margin-bottom: var(--sp-3); }
.approval__head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: var(--sp-2); }
.timeline__item { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
.timeline__meta { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; font-size: var(--fs-xs); }
.timeline__type { font-family: var(--font-mono); color: var(--green-300); }
.timeline__actor { color: var(--silver-500); }
.timeline__time { color: var(--silver-500); margin-left: auto; }
.timeline--compact li { display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-2); align-items: baseline; font-size: var(--fs-sm); }

/* Search */
.search-results, .command-results { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-2); }
.search-result { padding: var(--sp-2); border-radius: var(--radius-sm); }
.search-result:hover { background: var(--void-600); text-decoration: none; }
.command-result a { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-1) var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); }
.command-result a:hover, .command-result.is-active a { background: var(--void-600); text-decoration: none; }
.command-result__kind { font-size: var(--fs-xs); color: var(--silver-500); }
.command-result__sub { grid-column: 1 / -1; font-size: var(--fs-xs); }

.code-out { font-family: var(--font-mono); font-size: var(--fs-xs); white-space: pre-wrap; background: var(--void-900); padding: var(--sp-3); border-radius: var(--radius-sm); margin-top: var(--sp-3); color: var(--silver-300); max-height: 320px; overflow: auto; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(3, 5, 9, 0.7); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: var(--z-modal); padding: var(--sp-4); }
.modal { background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-2); }
.modal__header { display: flex; justify-content: space-between; align-items: center; padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
.modal__title { font-size: var(--fs-lg); }
.modal__body { padding: var(--sp-5); }
.modal__actions { display: flex; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); }

/* Toast */
.toast-root { position: fixed; bottom: var(--sp-5); right: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-2); z-index: var(--z-toast); }
.toast { background: var(--void-500); border: 1px solid var(--border-strong); border-left: 3px solid var(--green-400); padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm); box-shadow: var(--shadow-2); max-width: 360px; font-size: var(--fs-sm); animation: toastIn var(--dur) var(--ease); }
.toast--warn { border-left-color: var(--accent-warn); }
.toast--ok { border-left-color: var(--green-400); }
.toast--out { opacity: 0; transform: translateX(20px); transition: all var(--dur) var(--ease); }

/* animations.css — ambient motion. All animations respect reduced motion and
   pause when the document is hidden (§16). They never block navigation. */

@keyframes haloPulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.06); opacity: 1; }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Pause ambient loops when the tab is hidden or reduced motion is requested. */
:root.is-hidden .focal__halo,
:root.reduced-motion .focal__halo {
  animation-play-state: paused;
}
:root.reduced-motion .focal__halo { animation: none; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* responsive.css — Mac and iPad layouts (§18 Quality). */

/* iPad landscape / narrow desktop: collapse the sidebar to a top bar. */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .nav {
    grid-row: auto; position: static; height: auto; flex-direction: row; flex-wrap: wrap;
    align-items: center; gap: var(--sp-2); overflow-x: auto;
  }
  .nav__brand { padding: 0 var(--sp-2) 0 0; }
  .nav__primary { flex-direction: row; flex-wrap: wrap; }
  .nav__link { flex-direction: row; gap: var(--sp-1); }
  .nav__link-hint { display: none; }
  .nav__section-label { display: none; }
  .nav__locations { flex-direction: row; flex-wrap: wrap; }
  .nav__loc-name { display: none; }
  .nav__command { margin: 0 0 0 auto; }
  .footer { grid-column: 1; }
  .kv { grid-template-columns: 1fr; }
  .object-grid { grid-template-columns: 1fr; }
}

/* iPad portrait / phones. */
@media (max-width: 620px) {
  .content { padding: var(--sp-4); }
  .world-hero { flex-direction: column; }
  .focal__title { font-size: var(--fs-2xl); }
  .status-pill--muted { display: none; }
}

/* Honour the OS reduced-motion preference by default. */
@media (prefers-reduced-motion: reduce) {
  .card--link:hover, .map-node:hover, .world-card:hover { transform: none; }
}

  function routeForActivity(a) {

  // js/components/storage-status.js
  function renderStorageStatus(state2) {
    const providers = state2.settings.providers || [];

    const sources = state2.sources || [];
    const sourceRows = sources.map((s) => `<tr>
    <td>${esc(s.provider)}</td>
    <td>${esc(s.authority)}</td>
    <td class="muted">${esc(s.repository || s.path || s.url || "\u2014")}</td>
    <td>${esc(availabilityLabel(s))}</td>
    <td class="muted">${s.lastVerifiedAt ? esc(formatDate(s.lastVerifiedAt)) : "never"}</td>
  </tr>`).join("");
    const conflicts = state2.conflicts || [];
    return `

      <h2 class="panel__title">Storage providers</h2>

        <table class="table">
          <thead><tr><th>Provider</th><th>Authority</th><th>Reference</th><th>Availability</th><th>Verified</th></tr></thead>
          <tbody>${sourceRows || '<tr><td colspan="5" class="muted">No sources registered.</td></tr>'}</tbody>
        </table>
      </div>
      ${conflicts.length ? `<p class="callout callout--warn">Source conflicts detected: ${conflicts.length}. Conflicting authoritative sources are reported, not auto-resolved.</p>` : ""}
    </div>`;
  }
  function statusTag(status) {
    if (status === "connected") return "low";
    if (status === "mock") return "mock";

  }

  // js/search.js
  function tokenize(text) {
    return String(text || "").toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
  }
  function buildIndex(state2) {
    const records = [];
    for (const w of state2.worlds || []) {
      records.push({
        id: w.id,
        kind: "world",
        worldId: w.id,
        title: w.name,
        subtitle: w.description || "",
        route: `#/world/${w.id}`,
        text: [w.name, w.description, w.status, w.nextAction, (w.canon || []).map((c) => c.title).join(" ")].join(" ")
      });
    }
    for (const o of state2.objects || []) {
      records.push({
        id: o.id,
        kind: "object",
        worldId: o.worldId,
        title: o.title,
        subtitle: `${o.type} \xB7 ${o.provider}`,
        route: `#/object/${o.id}`,
        text: [o.title, o.type, o.provider, (o.tags || []).join(" "), o.path, o.repositoryUrl].join(" ")
      });
    }
    for (const r of state2.rooms || []) {
      records.push({
        id: r.id,
        kind: "room",
        worldId: r.worldId,
        title: r.name,
        subtitle: `Room \xB7 ${r.type || "section"}`,
        route: `#/world/${r.worldId}/room/${r.id}`,
        text: [r.name, r.type, r.notes].join(" ")
      });
    }
    for (const l of state2.locations || []) {
      records.push({
        id: l.id,
        kind: "location",
        worldId: null,
        title: l.name,
        subtitle: "Permanent Location",
        route: `#/location/${l.id}`,
        text: [l.name, l.function, l.responsibility].join(" ")
      });
    }
    return records;
  }
  function query(index, term, { worldId = null, limit = 50 } = {}) {
    const tokens = tokenize(term);
    if (!tokens.length) return [];
    let pool = index;
    if (worldId) pool = index.filter((r) => r.worldId === worldId);
    const scored = [];
    for (const rec of pool) {
      const haystack = rec.text.toLowerCase();
      let score = 0;
      for (const t of tokens) {
        if (haystack.includes(t)) score += 1;
        if (rec.title && rec.title.toLowerCase().includes(t)) score += 2;
      }
      if (score > 0) scored.push({ ...rec, score });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, limit);
  }

  function openCommandBar(state2) {

    const input = overlay.querySelector("#command-input");

    let current = [];
    function renderResults(list) {
      current = list;
      results.innerHTML = list.map((r, i) => `
      <li class="command-result ${i === 0 ? "is-active" : ""}">
        <a href="${esc(r.route)}" data-close-command>

    }

      const ok = await confirmDialog({ title: "Approve action", message: "Approve and execute this action immediately? This confirms you intend the exact effect described.", confirmLabel: "Approve & execute" });
      if (!ok) return;
      const r = await resolveApproval(el.dataset.id, "approve");
      toast(r.ok ? "Approved and executed" : `Not executed: ${r.reason || r.status}`, { kind: r.ok ? "ok" : "warn" });
    },
    "reject-approval": async (el) => {
      await resolveApproval(el.dataset.id, "reject");
      toast("Rejected \u2014 no action taken");
    },
    "toggle-setting": async (el) => {
      await actions.updateSettings({ [el.dataset.key]: el.checked });
      applyPreferences();
    },
    "toggle-flag": async (el) => {
      const flags = { ...getState().settings.featureFlags, [el.dataset.key]: el.checked };
      await actions.updateSettings({ featureFlags: flags });
    },
    "create-backup": async () => {
      await createBackup({ reason: "Manual snapshot" });
      toast("Backup created");
    },
    "restore-backup": async (el) => {
      const ok = await confirmDialog({ title: "Restore backup", message: "Replace current metadata with this snapshot?", confirmLabel: "Restore" });
      if (!ok) return;
      await restoreBackup(el.dataset.id);
      toast("Backup restored");
    },
    "export-data": () => exportData2(),
    "import-data": () => formImport(),
    "reset-data": async () => {
      const ok = await confirmDialog({ title: "Reset all data", message: "This permanently clears all Worlds, Objects and activity. A backup is taken and the reset is routed through approval. Continue?", confirmLabel: "Propose reset", danger: true });
      if (!ok) return;
      reportResult(await actions.resetData(), "Reset");
    },
    "run-validation": () => runValidation(),
    "open-source": (el) => toast("Provider is a labelled stub; open is not available. Reference preserved.", { kind: "warn" })
  };
  function reportResult(r, label) {
    if (!r) return;
    if (r.ok) toast(`${label} executed`, { kind: "ok" });
    else if (r.requiresApproval) toast(`${label} sent to Approvals for confirmation`, { kind: "warn" });
    else if (r.denied) toast(`${label} blocked: ${r.reason}`, { kind: "warn" });
    else toast(`${label} failed: ${r.reason || "unknown"}`, { kind: "warn" });
  }
  function formField(label, name, { value = "", type = "text", textarea = false, options = null, placeholder = "" } = {}) {
    if (options) {
      return `<label class="field"><span>${esc(label)}</span>
      <select name="${esc(name)}">${options.map((o) => `<option value="${esc(o.value)}" ${o.value === value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></label>`;
    }
    if (textarea) {
      return `<label class="field"><span>${esc(label)}</span><textarea name="${esc(name)}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></label>`;
    }
    return `<label class="field"><span>${esc(label)}</span><input name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;
  }
  function collectForm(overlay) {
    const data = {};
    overlay.querySelectorAll("[name]").forEach((el) => {
      data[el.name] = el.value;
    });
    return data;
  }
  function formNewWorld() {
    const body = `
    <p class="muted">Prepare a World proposal. Creation requires explicit approval (\xA723.3).</p>
    ${formField("Name", "name", { placeholder: "Project name" })}
    ${formField("Symbol", "symbol", { placeholder: "\u25C7" })}
    ${formField("Colour identity", "colorIdentity", { value: "#6fd68a", type: "text" })}
    ${formField("Priority", "priority", { value: "medium", options: [{ value: "high", label: "High" }, { value: "medium", label: "Medium" }, { value: "low", label: "Low" }] })}
    ${formField("Description / reason it cannot belong to an existing World", "description", { textarea: true })}`;
    openModal({
      title: "Propose new World",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Propose (requires approval)</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        if (!d.name) {
          toast("Name is required", { kind: "warn" });
          return false;
        }
        reportResult(await actions.createWorld(d), "World creation");
        return true;
      })
    });
  }
  function formEditWorld(id) {
    const w = getState().worlds.find((x) => x.id === id);
    if (!w) return;
    const body = `
    ${formField("Name", "name", { value: w.name })}
    ${formField("Priority", "priority", { value: w.priority, options: [{ value: "high", label: "High" }, { value: "medium", label: "Medium" }, { value: "low", label: "Low" }] })}
    ${formField("Last action", "lastAction", { value: w.lastAction })}
    ${formField("Next action", "nextAction", { value: w.nextAction })}
    ${formField("Future action", "futureAction", { value: w.futureAction })}
    ${formField("Description", "description", { value: w.description, textarea: true })}`;
    openModal({
      title: `Edit ${w.name}`,
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Save</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        reportResult(await actions.updateWorld(id, d), "World update");
        return true;
      })
    });
  }
  function formAddRoom(worldId) {
    const body = `${formField("Room name", "name", { placeholder: "e.g. Development" })}
    ${formField("Type", "type", { value: "section", options: ["development", "assets", "canon", "animation", "code", "research", "release", "section"].map((t) => ({ value: t, label: t })) })}`;
    openModal({
      title: "Add room",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Add</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        if (!d.name) {
          toast("Name required", { kind: "warn" });
          return false;
        }
        reportResult(await actions.createRoom({ ...d, worldId }), "Add room");
        return true;
      })
    });
  }
  function formAddObject(worldId, roomId) {
    const body = `
    ${formField("Title", "title")}
    ${formField("Type", "type", { value: "image", options: ["image", "video", "audio", "document", "code", "repository", "link"].map((t) => ({ value: t, label: t })) })}
    ${formField("Provider", "provider", { value: "local", options: getState().settings.providers.map((p) => ({ value: p.providerId, label: `${p.providerId} (${p.status})` })) })}
    ${formField("Path", "path", { placeholder: "relative or provider path" })}
    ${formField("Repository / URL", "repositoryUrl", { placeholder: "https://\u2026" })}
    ${formField("Tags (comma separated)", "tags")}`;
    openModal({
      title: "Add object reference",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Add</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        if (!d.title) {
          toast("Title required", { kind: "warn" });
          return false;
        }
        const payload = { ...d, worldId, roomId: roomId || null, tags: d.tags ? d.tags.split(",").map((t) => t.trim()).filter(Boolean) : [] };
        reportResult(await actions.createObject(payload), "Add object");
        return true;
      })
    });
  }
  function formEditObject(id) {
    const o = getState().objects.find((x) => x.id === id);
    if (!o) return;
    const body = `${formField("Title", "title", { value: o.title })}
    ${formField("Stage", "stage", { value: o.stage, options: ["draft", "final", "reference", "superseded"].map((s) => ({ value: s, label: s })) })}
    ${formField("Path", "path", { value: o.path })}
    ${formField("Repository / URL", "repositoryUrl", { value: o.repositoryUrl })}`;
    openModal({
      title: "Edit object",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Save</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        reportResult(await actions.updateObject(id, d), "Object update");
        return true;
      })
    });
  }
  function formAddCanon(worldId) {
    const body = `<p class="muted">Changing canon requires a recorded proposal and approval.</p>
    ${formField("Title", "title")}
    ${formField("Decision", "decision", { textarea: true })}`;
    openModal({
      title: "Propose canon change",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Propose (requires approval)</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        if (!d.title) {
          toast("Title required", { kind: "warn" });
          return false;
        }
        reportResult(await actions.addCanon(worldId, d), "Canon change");
        return true;
      })
    });
  }
  function formCapture() {
    const body = `${formField("Capture for Chief", "input", { textarea: true, placeholder: "What should Chief handle?" })}
    ${formField("Reasoning depth", "reasoningDepth", { value: "brain", options: [{ value: "brain", label: "Brain (routine)" }, { value: "strategy", label: "Strategy (planning)" }, { value: "oracle", label: "Oracle (deep, advisory)" }] })}`;
    openModal({
      title: "Quick capture",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" data-submit>Capture</button>`,
      onMount: (overlay, close) => wireSubmit(overlay, close, async (d) => {
        if (!d.input) {
          toast("Nothing to capture", { kind: "warn" });
          return false;
        }
        reportResult(await actions.capture(d.input, d.reasoningDepth), "Capture");
        return true;
      })
    });
  }
  function formImport() {
    const body = `<p class="muted">Paste an exported Atlas metadata JSON. It is validated and a backup is taken before applying.</p>
    <textarea name="payload" class="input" rows="10" placeholder='{"worlds":[\u2026]}'></textarea>
    <div id="import-preview" class="code-out"></div>`;
    openModal({
      title: "Import metadata",
      bodyHtml: body,
      actionsHtml: `<button class="btn" data-modal-close>Cancel</button><button class="btn" data-preview>Validate</button><button class="btn btn--primary" data-submit disabled>Apply import</button>`,
      onMount: (overlay, close) => {
        const preview = overlay.querySelector("#import-preview");
        const applyBtn = overlay.querySelector("[data-submit]");
        let parsed = null;
        overlay.querySelector("[data-preview]").addEventListener("click", () => {
          try {
            parsed = JSON.parse(overlay.querySelector("[name=payload]").value);
          } catch (e) {
            preview.textContent = `Invalid JSON: ${e.message}`;
            applyBtn.disabled = true;
            return;
          }
          const res = previewImport(parsed);
          preview.textContent = res.valid ? `Valid. Worlds: ${res.counts.worlds}, Rooms: ${res.counts.rooms}, Objects: ${res.counts.objects}, Sources: ${res.counts.sources}.` : `Invalid:
- ${res.errors.join("\n- ")}`;
          applyBtn.disabled = !res.valid;
        });
        applyBtn.addEventListener("click", async () => {
          if (!parsed) return;
          await importDataset(parsed);
          recomputeConflicts();
          toast("Import applied");
          close();
        });
      }
    });
  }
  function wireSubmit(overlay, close, onSubmit) {
    const submit = overlay.querySelector("[data-submit]");
    if (!submit) return;
    submit.addEventListener("click", async () => {
      const ok = await onSubmit(collectForm(overlay));
      if (ok !== false) close();
    });
  }
  function exportData2() {
    const blob = exportToBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `void-dominion-export-${now().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Export downloaded");
  }
  function runValidation() {
    const state2 = getState();
    const res = validateDataset({ worlds: state2.worlds, rooms: state2.rooms, objects: state2.objects, sources: state2.sources });
    const out = document.getElementById("diagnostics-output");
    if (out) {
      out.textContent = res.valid ? `Validation passed. ${state2.worlds.length} worlds, ${state2.rooms.length} rooms, ${state2.objects.length} objects.` : `Validation errors:
- ${res.errors.join("\n- ")}`;
    }
  }
  function recomputeConflicts() {
    setConflicts(detectConflicts(getState().objects));
  }
  function handleWorldSearch(el) {
    const state2 = getState();
    const index = buildIndex(state2);
    const results = query(index, el.value, { worldId: el.dataset.world, limit: 10 });
    const box = document.getElementById("world-search-results");
    if (box) {
      box.innerHTML = results.map((r) => `<a class="search-result" href="${esc(r.route)}">${esc(r.title)} <span class="muted">${esc(r.kind)}</span></a>`).join("") || '<p class="muted">No matches.</p>';
    }
  }
  function applyPreferences() {
    const s = getState().settings;
    document.documentElement.classList.toggle("reduced-motion", !!s.reducedMotion);
    document.documentElement.classList.toggle("dev-mode", !!s.developerMode);
    try {
      localStorage.setItem("vd:reducedMotion", s.reducedMotion ? "1" : "0");
    } catch (_) {
    }
  }
  async function boot() {
    els.nav = document.getElementById("nav-root");
    els.status = document.getElementById("status-root");
    els.view = document.getElementById("view-root");
    initUI();
    els.view.innerHTML = '<div class="panel"><p>Loading Void Dominion\u2026</p></div>';
    try {
      registerProviders();
      const seed = await loadSeed();
      let adapter = createIndexedDBAdapter();
      try {
        await initStore(adapter, seed);
      } catch (dbErr) {
        console.warn("[boot] IndexedDB unavailable, using in-memory storage", dbErr);
        adapter = createMemoryAdapter();
        await initStore(adapter, seed);
        setTimeout(() => toast("Running in memory-only mode \u2014 changes will not persist across reloads in this browser.", { kind: "warn", timeout: 6e3 }), 800);
      }
      recomputeConflicts();
      applyPreferences();
      defineRoutes();
      onRoute(renderView);
      on("state.changed", rerender);
      on("approval.requested", rerender);
      on("approval.resolved", rerender);
      document.body.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el || el.tagName === "INPUT") return;
        const handler = handlers[el.dataset.action];
        if (handler) {
          e.preventDefault();
          handler(el);
        }
      });
      document.body.addEventListener("change", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el || el.tagName !== "INPUT") return;
        const handler = handlers[el.dataset.action];
        if (handler) handler(el);
      });
      document.body.addEventListener("input", (e) => {
        const el = e.target.closest('[data-action="world-search"]');
        if (el) handleWorldSearch(el);
      });
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openCommandBar(getState());
        }
      });
      document.addEventListener("visibilitychange", () => {
        document.documentElement.classList.toggle("is-hidden", document.hidden && getState().settings.pauseAmbientWhenHidden);
      });
      start();
    } catch (err) {
      console.error("[boot] failed", err);
      els.view.innerHTML = `<div class="panel"><h1>Startup error</h1><p class="callout callout--warn">${esc(err.message)}</p><p class="muted">Serve the app over a local HTTP server (see README) so data files and ES modules load correctly.</p></div>`;
    }
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
