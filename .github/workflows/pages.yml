name: Deploy Void Dominion to GitHub Pages

# Publishes the void-dominion/ app to GitHub Pages so it can be opened from a
# plain URL with no local setup. Serves the void-dominion folder as the site
# root, so the app loads at https://<owner>.github.io/<repo>/.

on:
  push:
    branches:
      - main
      - claude/new-session-vfjutq
    paths:
      - 'void-dominion/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the void-dominion app as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: void-dominion

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
